<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock, Paper, Scissors, Lizard, Spock</title>
  <link rel="icon" href="./assets/img/4geeks.ico" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCmKTYK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
    integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous" />

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="row justify-content-center w-100">
      <div class="col-md-8 col-lg-6 game-card p-4 text-center">

        <h1 class="mt-2 mb-4">Rock, Paper, Scissors, Lizard, Spock</h1>

        <div class="ratio ratio-16x9 mb-4">
          <iframe src="https://www.youtube.com/embed/_PUEoDYpUyQ?si=L9o0DezoxnaU0pQu" title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

        <div id="botones" class="d-flex flex-wrap justify-content-center gap-2 mb-4">
          <button id="rock" class="btn btn-outline-dark px-3 py-2"> Rock</button>
          <button id="paper" class="btn btn-outline-dark px-3 py-2"> Paper</button>
          <button id="scissors" class="btn btn-outline-dark px-3 py-2"> Scissors</button>
          <button id="lizard" class="btn btn-outline-dark px-3 py-2"> Lizard</button>
          <button id="spock" class="btn btn-outline-dark px-3 py-2"> Spock</button>
        </div>

        <div class="bg-light rounded p-3 mb-3 border text-secondary fw-bold">
          <p class="m-1">Your choice: <span id="user-result" class="text-primary">-</span></p>
          <p class="m-1">Computer's choice: <span id="computer-result" class="text-danger">-</span></p>
        </div>

        <h2 id="game-status" class="h4 text-dark py-2">Choose an option</h2>

      </div>
    </div>
  </div>

</body>
<script type="module" src="app.js"></script>

</html>
